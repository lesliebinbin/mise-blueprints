_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Human-readable CUDA extension project name
  default: My PyTorch Extension

project_slug:
  type: str
  help: Distribution and repository name
  default: "{{ project_name | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase letters, digits, and hyphens; start with a letter.
    {% endif %}

package_name:
  type: str
  help: Importable Python package name
  default: "{{ project_slug | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use lowercase letters, digits, and underscores; start with a letter.
    {% endif %}

description:
  type: str
  help: One-line project description
  default: A mise and uv managed PyTorch CUDA extension project

python_version:
  type: str
  help: Python runtime managed by mise
  choices:
    - "3.12"
    - "3.13"
    - "3.14"
  default: "3.12"

author_name:
  type: str
  help: Package author
  default: Your Name
