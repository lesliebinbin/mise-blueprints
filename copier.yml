_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Human-readable project name
  default: My PhysX Project

project_slug:
  type: str
  help: CMake project, target, and executable name
  default: "{{ project_name | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase letters, digits, and hyphens; start with a letter.
    {% endif %}

description:
  type: str
  help: One-line project description
  default: A mise-managed PhysX 5 GPU program built with CMake
