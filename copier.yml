_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Human-readable application name
  default: My React App

project_slug:
  type: str
  help: Package and repository name
  default: "{{ project_name | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase letters, digits, and hyphens; start with a letter.
    {% endif %}

description:
  type: str
  help: One-line application description
  default: A mise-managed React application

node_version:
  type: str
  help: Node.js runtime managed by mise
  choices:
    - "22"
    - "24"
  default: "24"
