_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

module_name:
  type: str
  help: >-
    Extension name: CMake project and target, shared-library stem, and Lisp
    symbol prefix used by the registered functions
  default: my-emacs-module
  validator: >-
    {% if not (module_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase letters, digits, and hyphens; start with a letter.
    {% endif %}

description:
  type: str
  help: One-line module description
  default: A mise-managed Emacs native module written in C++20
