_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

package_name:
  type: str
  help: Emacs package and feature name
  default: my-package
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase letters, digits, and hyphens; start with a letter.
    {% endif %}

description:
  type: str
  help: One-line package description
  default: A mise-managed Emacs Lisp package

author_name:
  type: str
  help: Package author
  default: Your Name

author_email:
  type: str
  help: Package author email
  default: you@example.com

emacs_version:
  type: str
  help: Minimum supported Emacs version
  choices:
    - "29.1"
    - "30.1"
    - "31.1"
  default: "29.1"
